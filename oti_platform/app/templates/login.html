{% extends "base.html" %}
{% block title %}登录 - 开源威胁情报智能分级搜索平台{% endblock %}
{% block content %}
<div class="auth-layout">
  <section class="auth-hero">
    <span class="eyebrow">Threat Intelligence Platform</span>
    <h1>开源威胁情报智能分级搜索平台</h1>
    <div class="auth-points">
      <div class="auth-point">缓存优先</div>
      <div class="auth-point">聚合查询</div>
      <div class="auth-point">权限治理</div>
      <div class="auth-point">审计追踪</div>
    </div>
  </section>

  <section class="auth-card">
    <div class="auth-card-head">
      <span class="eyebrow eyebrow-dark">系统登录</span>
      <h2>欢迎回来</h2>
      <p>输入账号和密码后进入统一检索控制台。</p>
    </div>

    {% if error %}
    <div class="alert alert-danger">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" class="auth-form">
      <div class="field">
        <label>用户名</label>
        <input class="input" type="text" name="username" placeholder="请输入用户名" required>
      </div>
      <div class="field">
        <label>密码</label>
        <input class="input" type="password" name="password" placeholder="请输入密码" required>
      </div>
      <button class="btn btn-primary btn-lg btn-block" type="submit">登录系统</button>
    </form>
  </section>
</div>
{% endblock %}
